; Configuración PHP Recomendada para Gogleanty
; Copia estas líneas al final de tu archivo php.ini en XAMPP
; Ubicación: C:\xampp\php\php.ini

; Límites de subida de archivos
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Extensiones requeridas (asegúrate de que estén habilitadas)
; Busca estas líneas en php.ini y quita el ; al inicio si lo tienen

; Para procesamiento de imágenes
extension=gd

; Para leer metadatos EXIF
extension=exif

; Para conexión a MySQL
extension=mysqli

; Para manejo de archivos
extension=fileinfo

; Configuración de errores (para desarrollo)
display_errors = On
error_reporting = E_ALL

; Zona horaria (ajusta según tu ubicación)
date.timezone = America/Bogota

; Configuración de sesiones
session.save_path = "C:\xampp\tmp"

; Configuración de caché
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000

; IMPORTANTE: Después de modificar php.ini
; 1. Guarda el archivo
; 2. Abre XAMPP Control Panel
; 3. Detén Apache (Stop)
; 4. Inicia Apache nuevamente (Start)
